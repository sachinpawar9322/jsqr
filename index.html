<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
</head>
<body>
<script>
var h = location.hash.slice(1);
if(h){
  var bin = atob(h);
  var bytes = new Uint8Array(bin.length);
  for(var i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
  var ds = new DecompressionStream('gzip');
  var w = ds.writable.getWriter();
  w.write(bytes); w.close();
  var reader = ds.readable.getReader();
  var chunks = [];
  (async function(){
    for(;;){ var r = await reader.read(); if(r.done) break; chunks.push(r.value); }
    var len = chunks.reduce(function(a,b){ return a + b.length; }, 0);
    var buf = new Uint8Array(len); var off = 0;
    chunks.forEach(function(c){ buf.set(c, off); off += c.length; });
    document.open(); document.write(new TextDecoder().decode(buf)); document.close();
  })();
}
</script>
</body>
</html>
