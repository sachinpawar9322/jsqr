<!doctypehtml><meta content=width=device-width,initial-scale=1,user-scalable=no name=viewport><style>* { margin: 0; padding: 0; box-sizing: border-box; }body { background: #000; overflow: hidden; }canvas { display: block; }</style><body><canvas id=c></canvas><script>const CV=document.getElementById('c');const X=CV.getContext('2d');let W,H,S,cols,rows,ox,oy;function resize(){W=CV.width=innerWidth;H=CV.height=innerHeight;S=Math.max(Math.floor(Math.min(W,H)/22),12);cols=Math.floor(W/S);rows=Math.floor(H/S);ox=W- cols*S>>1;oy=H- rows*S>>1}addEventListener('resize',resize);resize();const TITLE=0,PLAY=1,DEAD=2;let state=TITLE;let sn,dir,ndir,food,score,hi,speed,lastTick,newBest;function loadHi(){try{return +localStorage.snakeHi||0}catch(a){return 0}}function saveHi(a){try{localStorage.snakeHi=a}catch(b){}}function startGame(){const a=cols>>1,b=rows>>1;sn=[{x:a,y:b},{x:a- 1,y:b},{x:a- 2,y:b}];dir={x:1,y:0};ndir=null;food=spawnFood();score=0;speed=130;newBest=false;lastTick=performance.now();state=PLAY}function spawnFood(){let a;do{a={x:Math.random()*cols|0,y:Math.random()*rows|0}}while(sn.some(b=>b.x===a.x&&b.y===a.y));return a}const DIRS={37:{x:-1,y:0},65:{x:-1,y:0},38:{x:0,y:-1},87:{x:0,y:-1},39:{x:1,y:0},68:{x:1,y:0},40:{x:0,y:1},83:{x:0,y:1}};addEventListener('keydown',a=>{const b=DIRS[a.keyCode];if(b&&state===PLAY&&(b.x+ dir.x||b.y+ dir.y))ndir=b;if((a.key==='Enter'||a.key===' ')&&state!==PLAY)startGame()});let tStart=null;addEventListener('touchstart',a=>{a.preventDefault();if(state!==PLAY){startGame();return};tStart={x:a.touches[0].clientX,y:a.touches[0].clientY}},{passive:false});addEventListener('touchend',a=>{a.preventDefault();if(!tStart||state!==PLAY)return;const b=a.changedTouches[0].clientX- tStart.x;const c=a.changedTouches[0].clientY- tStart.y;tStart=null;if(Math.abs(b)<10&&Math.abs(c)<10)return;const d=Math.abs(b)>Math.abs(c)?{x:b>0?1:-1,y:0}:{x:0,y:c>0?1:-1};if(d.x+ dir.x||d.y+ dir.y)ndir=d},{passive:false});function tick(){if(ndir){dir=ndir;ndir=null};const a={x:(sn[0].x+ dir.x+ cols)%cols,y:(sn[0].y+ dir.y+ rows)%rows};if(sn.some(b=>b.x===a.x&&b.y===a.y)){state=DEAD;if(score>hi){hi=score;saveHi(hi);newBest=true};return};sn.unshift(a);if(a.x===food.x&&a.y===food.y){score++;food=spawnFood();speed=Math.max(55,speed- 3)}else{sn.pop()}}let frame=0;function drawFood(a){const b=0.82+ 0.18*Math.sin(frame*0.11);const c=ox+ a.x*S+ S/2,d=oy+ a.y*S+ S/2;const e=S*0.42*b;X.fillStyle='#ff3d1a';X.beginPath();X.arc(c,d,e,0,Math.PI*2);X.fill();X.fillStyle='rgba(255,190,150,0.75)';X.beginPath();X.arc(c- e*0.28,d- e*0.28,e*0.32,0,Math.PI*2);X.fill()}function drawSnake(a){const b=Math.max(sn.length- 1,1);sn.forEach((c,d)=>{const e=d/b;const f=ox+ c.x*S,g=oy+ c.y*S;const h=Math.max(1,S*0.07);X.fillStyle=`hsl(135,${a?40:90}%,${a?18:Math.round(58- e*38)}%)`;X.beginPath();X.roundRect(f+ h,g+ h,S- h*2,S- h*2,S*0.32);X.fill()})}function drawHUD(){const a=Math.max(26,S*1.1);X.fillStyle='rgba(0,0,0,0.55)';X.fillRect(ox,oy,cols*S,a);const b=Math.max(11,S*0.55)|0;X.font=`bold ${b}px monospace`;X.textBaseline='middle';X.fillStyle='#0f0';X.textAlign='left';X.fillText(score,ox+ S*0.35,oy+ a/2);X.fillStyle='#333';X.textAlign='right';X.fillText(`BEST  ${hi}`,ox+ cols*S- S*0.35,oy+ a/2)}function drawOverlay(a,b){X.fillStyle='rgba(0,0,0,0.84)';X.fillRect(0,0,W,H);const c=W/2,d=H/2;X.textAlign='center';X.textBaseline='middle';const e=Math.min(W,H)*0.09|0;X.font=`bold ${e}px monospace`;X.shadowColor='#0f0';X.shadowBlur=28;X.fillStyle='#0f0';X.fillText(a,c,d- e*1.3);X.shadowBlur=0;const f=Math.max(14,e*0.38)|0;X.font=`${f}px monospace`;b.forEach((g,h)=>{X.fillStyle=g[0]==='▶'||g[0]==='★'?'#0f0':'#555';X.fillText(g,c,d+ h*f*1.55)})}function render(a){frame++;X.fillStyle='#000';X.fillRect(0,0,W,H);if(state!==TITLE){drawFood(food);drawSnake(state===DEAD);drawHUD()};if(state===TITLE){drawOverlay('SNAKE',['arrow keys  or  WASD','swipe on mobile','','▶  tap or press any key'])}else if(state===DEAD){drawOverlay('GAME OVER',[`score    ${score}`,newBest?'★  new best!':`best     ${hi}`,'','▶  tap or press enter'])}}function loop(a){requestAnimationFrame(loop);if(state===PLAY&&a- lastTick>=speed){lastTick+=speed;tick()};render(a)}hi=loadHi();requestAnimationFrame(loop)</script>
