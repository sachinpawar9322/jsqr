<html>
<head>
<style>body{margin:0;background:#000;display:flex;align-items:center;justify-content:center;height:100vh}</style>
</head>
<body>
<canvas id=c></canvas>
<script>
var G=20,x=c.getContext('2d'),s=Math.min(~~((Math.min(innerWidth,innerHeight)-20)/G),20);
c.width=c.height=G*s;
var sn,d,nd,fd,pt,ok;
function ri(){sn=[{x:10,y:10}];d={x:1,y:0};nd=null;fd=ap();pt=0;ok=1}
function ap(){var a;do a={x:G*Math.random()|0,y:G*Math.random()|0};while(sn.some(q=>q.x==a.x&q.y==a.y));return a}
onkeydown=e=>{var m=[{x:-1,y:0},{x:0,y:-1},{x:1,y:0},{x:0,y:1}][e.keyCode-37];if(m&&(m.x+d.x||m.y+d.y))nd=m;if(!ok)ri()};
var tx,ty;
c.ontouchstart=e=>{e.preventDefault();var t=e.touches[0];tx=t.clientX;ty=t.clientY};
c.ontouchend=e=>{
  e.preventDefault();if(!ok){ri();return}
  var t=e.changedTouches[0],dx=t.clientX-tx,dy=t.clientY-ty;
  nd=Math.abs(dx)>Math.abs(dy)?{x:dx>0?1:-1,y:0}:{x:0,y:dy>0?1:-1}
};
function dr(){
  var W=G*s;
  x.fillStyle='#000';x.fillRect(0,0,W,W);
  x.fillStyle='#f04';x.beginPath();x.arc(fd.x*s+s/2,fd.y*s+s/2,s/2-1,0,6.28);x.fill();
  sn.forEach((p,j)=>{x.fillStyle=j?'#060':'#0f0';x.fillRect(p.x*s+1,p.y*s+1,s-2,s-2)});
  x.fillStyle='#0f0';x.font=(s*.7|0)+'px monospace';x.fillText(pt,3,s*.75);
  if(!ok){
    x.fillStyle='rgba(0,0,0,.7)';x.fillRect(0,0,W,W);
    x.textAlign='center';x.fillStyle='#0f0';x.font='bold '+s+'px monospace';
    x.fillText('GAME OVER',W/2,W/2);
    x.font=(s*.65|0)+'px monospace';x.fillStyle='#060';
    x.fillText('tap / enter',W/2,W/2+s*1.2)
  }
}
function tk(){if(ok){if(nd){d=nd;nd=null}var h={x:(sn[0].x+d.x+G)%G,y:(sn[0].y+d.y+G)%G};if(sn.some(q=>q.x==h.x&q.y==h.y))ok=0;else{sn.unshift(h);if(h.x==fd.x&h.y==fd.y){pt++;fd=ap()}else sn.pop()}}dr();setTimeout(tk,100)}
ri();tk();
</script>
</html>
